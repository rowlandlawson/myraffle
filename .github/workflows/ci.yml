name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-check:
    name: Backend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raffle-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Backend Dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Typecheck Backend
        run: bun run build || bunx tsc --noEmit

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raffle-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Next.js Application
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.myraffleapp.com"
