<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | myRaffle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }
    .logo {
      height: 48px;
      margin-bottom: 1.5rem;
    }
    .wifi-icon {
      width: 64px;
      height: 64px;
      background: #fee2e2;
      color: #E10600;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 28px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #E10600;
      color: white;
      font-weight: 700;
      padding: 0.875rem 1.5rem;
      border-radius: 0.875rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #99000a;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/logo.png" alt="myRaffle" class="logo">
    <div class="wifi-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again to access live raffles and your account.</p>
    <button class="btn" onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
